<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06040f">
<meta name="description" content="لعبة تايكون وIdle بمنظور 2.5D: ابنِ إمبراطورية، بع كل شيء حتى الكون، وشاهد الثقب الأسود يبتلع السماء.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>إمبراطورية بائع الكون</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-main">
      <div class="coins"><span id="coins">0</span> 🪙</div>
      <div class="sub"><span id="inc">0</span> /ث <span id="rpv"></span></div>
    </div>
    <div class="chips">
      <span class="chip boost" id="boostChip" hidden>⚡ ×2 <b id="boostT"></b></span>
      <span class="chip" id="shardChip" hidden title="الشظايا">🌑 <b id="shards">0</b></span>
    </div>
    <button id="btnSettings" class="iconbtn" type="button" aria-label="الإعدادات">⚙️</button>
  </header>

  <div id="stage">
    <canvas id="scene" aria-label="مدينتك. اضغط على قطعة أرض لتبني عليها"></canvas>
    <div id="zones" role="group" aria-label="المناطق"></div>
    <div id="quest" hidden>
      <div class="qt"><span id="qText"></span><small id="qProg"></small></div>
      <div class="bar"><i id="qFill"></i></div>
      <button id="qClaim" class="btn primary small" type="button" hidden>استلم</button>
    </div>
    <div id="toasts" aria-live="polite"></div>
  </div>

  <div id="dock">
    <button id="sell" type="button">
      <span id="emoji" aria-hidden="true">💧</span>
      <span class="t"><b id="iname"></b><span id="price"></span></span>
    </button>
    <div class="prog">
      <div class="bar"><i id="fill"></i></div>
      <small id="left"></small>
    </div>
  </div>

  <nav id="tabs" role="tablist" aria-label="الأقسام">
    <button data-tab="city" class="on" role="tab" aria-selected="true">🏙️<span>المدينة</span></button>
    <button data-tab="up" role="tab" aria-selected="false">⚡<span>ترقيات</span></button>
    <button data-tab="quests" id="tabQ" role="tab" aria-selected="false">🎯<span>مهام</span></button>
    <button data-tab="uni" id="tabU" role="tab" aria-selected="false">🌌<span>الكون</span></button>
  </nav>
  <section id="panel" role="tabpanel" tabindex="-1"></section>
</div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div id="mBtns"></div>
  </div>
</div>
<div id="cine" hidden aria-live="assertive"></div>

<noscript><p style="color:#fff;padding:20px">تحتاج اللعبة إلى تفعيل JavaScript.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
